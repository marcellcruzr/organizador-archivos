<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizador de Archivos</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 1.5rem; }
        .drop-zone {
            border: 2px dashed #3498db;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        .drop-zone p { color: #7f8c8d; }
        input[type="file"] { display: none; }
        .btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            margin-bottom: 10px;
        }
        .btn:hover { background-color: #27ae60; }
        .btn:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .btn-secondary { background-color: #3498db; }
        .btn-secondary:hover { background-color: #2980b9; }
        .btn-download { background-color: #9b59b6; }
        .btn-download:hover { background-color: #8e44ad; }
        #results { margin-top: 1.5rem; }
        .result-item {
            background: #ecf0f1;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
        }
        .folder-badge {
            background: #3498db;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
        }
        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.85rem;
            color: #7f8c8d;
        }
        footer strong { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 Organizador de Archivos</h1>
        
        <div class="drop-zone" onclick="document.getElementById('fileInput').click()">
            <p>Arrastra y suelta tus archivos aquí o<br><strong>haz clic para seleccionar</strong></p>
            <input type="file" id="fileInput" name="files" multiple>
        </div>
        
        <button class="btn" id="submitBtn" onclick="uploadFiles()" disabled>Organizar Archivos</button>
        <button class="btn btn-secondary" onclick="verCarpetas()">📂 Ver Carpetas</button>
        <button class="btn btn-download" onclick="descargarZIP()">️ Descargar ZIP</button>

        <div id="results"></div>

        <footer>
            <p><strong>⚠️ AVISO LEGAL:</strong> Desarrollado por <strong>Marcell Cruz</strong>. 
            Cualquier distribución no autorizada será acreedora a sanciones legales.</p>
            <p>© 2026 Marcell Cruz. Todos los derechos reservados.</p>
        </footer>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const submitBtn = document.getElementById('submitBtn');
        const resultsDiv = document.getElementById('results');

        fileInput.addEventListener('change', () => {
            submitBtn.disabled = fileInput.files.length === 0;
        });

        async function uploadFiles() {
            if (fileInput.files.length === 0) {
                alert('Selecciona archivos primero');
                return;
            }

            const formData = new FormData();
            for (let file of fileInput.files) {
                formData.append('files', file);
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Procesando...';
            resultsDiv.innerHTML = '';

            try {
                console.log('Enviando archivos...');
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });

                console.log('Status:', response.status);
                const data = await response.json();
                console.log('Response:', data);

                if (data.success) {
                    data.files.forEach(file => {
                        const item = document.createElement('div');
                        item.className = 'result-item';
                        item.innerHTML = `
                            <span>${file.original}</span>
                            <span class="folder-badge">${file.folder}</span>
                        `;
                        resultsDiv.appendChild(item);
                    });
                    fileInput.value = '';
                    submitBtn.disabled = true;
                } else {
                    alert('Error: ' + (data.error || 'Error desconocido'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Organizar Archivos';
            }
        }

        async function verCarpetas() {
            try {
                const response = await fetch('/ver-carpetas');
                const carpetas = await response.json();
                
                let html = '<h3 style="margin: 1rem 0;">📂 Carpetas:</h3>';
                if (Object.keys(carpetas).length === 0) {
                    html += '<p>No hay archivos organizados</p>';
                } else {
                    for (const [nombre, archivos] of Object.entries(carpetas)) {
                        html += `<div style="background:#ecf0f1; padding:10px; margin:5px 0; border-radius:5px;">`;
                        html += `<strong>${nombre}:</strong> ${archivos.length} archivos`;
                        html += `</div>`;
                    }
                }
                resultsDiv.innerHTML = html;
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        function descargarZIP() {
            window.location.href = '/descargar-organizado';
        }
    </script>
</body>
</html>
